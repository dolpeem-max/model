<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หาพิกัดโครงสร้างเซลล์ (3D Model)</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
        }
        /* กำหนดขนาดของกล่องแสดงโมเดล 3 มิติ */
        #my-model {
            width: 100vw;
            height: 75vh;
            background-color: #ffffff;
            outline: none;
        }
        /* ตกแต่งกล่องข้อความแสดงผล */
        .info-panel {
            margin-top: 15px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        #coord-result {
            font-size: 1.2em;
            color: #d93025;
            font-weight: bold;
            margin: 10px 0;
            padding: 10px;
            background: #fce8e6;
            border-radius: 4px;
            user-select: all; /* ทำให้กดคลิกทีเดียวแล้วคลุมดำก๊อปปี้ได้ง่าย */
        }
    </style>
</head>
<body>

    <model-viewer 
    id="my-model" 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    camera-controls 
    shadow-intensity="1"
    alt="โมเดลทดสอบ">
    </model-viewer>

    <div class="info-panel">
        <p>🔄 สามารถใช้เมาส์หรือนิ้ว หมุนและซูมดูโมเดลได้เลย</p>
        <p>👇 <b>คลิกที่ส่วนต่างๆ ของเซลล์เพื่อดึงพิกัด</b> 👇</p>
        <div id="coord-result">ยังไม่ได้คลิกโมเดล</div>
        <p style="font-size: 0.85em; color: gray;">(คัดลอกข้อความสีแดงไปใช้สร้างจุดคลิกในขั้นตอนต่อไปได้เลยครับ)</p>
    </div>

    <script>
        const modelViewer = document.querySelector('#my-model');
        const resultDiv = document.querySelector('#coord-result');

        // ตรวจจับเมื่อมีการคลิกที่ตัวโมเดล
        modelViewer.addEventListener('click', (event) => {
            // ดึงตำแหน่งที่เมาส์คลิกบนหน้าจอ
            const rect = modelViewer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // ให้โมเดลคำนวณว่าจุดที่คลิก ตรงกับพิกัด X Y Z อะไรบนตัว 3D
            const hit = modelViewer.positionAndNormalFromPoint(x, y);

            if (hit != null) {
                // ถ้าคลิกโดนโมเดล ให้ดึงค่า XYZ ออกมา (ปัดเศษทศนิยม 4 ตำแหน่ง)
                const posX = hit
