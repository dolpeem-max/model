<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Plant Cell Explorer & Coordinate Picker</title>
    
    <!-- เรียกใช้งานไลบรารี model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #121216; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; color: white; }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* แผงควบคุมแสดงพิกัดด้านบน (สำหรับหาตำแหน่ง) */
        #coord-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.9); border: 2px solid #00ffcc; padding: 12px 20px;
            border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,255,204,0.3);
            z-index: 100; pointer-events: none;
        }
        #coord-title { font-size: 13px; color: #888; margin-bottom: 3px; }
        #coord-value { font-size: 18px; font-weight: bold; color: #00ffcc; font-family: monospace; }
        #copy-status { font-size: 11px; color: #ff33cc; margin-top: 3px; height: 14px; }

        /* ปุ่ม AR ด้านล่าง */
        #ar-button {
            background-color: #ffffff;
            color: #333;
            border-radius: 20px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }

        /* การตกแต่งปุ่มตัวเลข (Hotspot) */
        .hotspot-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }

        .hotspot-number {
            background-color: rgba(40, 40, 50, 0.9);
            color: white;
            border: 1px solid #aaa;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        /* กล่องคำอธิบายสีเข้ม (Annotation Box) */
        .annotation-box {
            background-color: rgba(20, 20, 25, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            width: 250px;
            text-align: left;
            position: absolute;
            top: 50%;
            left: 40px; 
            transform: translateY(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 5;
        }

        /* เมื่อคลิกหรือเอาเมาส์ชี้ที่ตัวเลข ให้โชว์กล่องข้อความ */
        .hotspot-btn:focus .annotation-box,
        .hotspot-btn:hover .annotation-box {
            opacity: 1;
            visibility: visible;
        }

        /* การจัดรูปแบบข้อความ 3 บรรทัด */
        .anno-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .anno-function {
            font-size: 13px;
            font-weight: bold;
            color: #4da6ff; 
            margin-bottom: 5px;
        }
        .anno-desc {
            font-size: 12px;
            line-height: 1.5;
            color: #dcdcdc;
        }
    </style>
</head>
<body>

    <!-- แผงแสดงพิกัดสำหรับ Developer -->
    <div id="coord-panel">
        <div id="coord-title">🎯 พิกัดจุดที่คุณคลิก (คัดลอกให้อัตโนมัติแล้ว)</div>
        <div id="coord-value">คลิกซ้ายบนโมเดล 3D ได้เลย</div>
        <div id="copy-status"></div>
    </div>

    <!-- โหลดโมเดล 3D พร้อม Hotspots ทั้งหมด -->
    <model-viewer 
        id="cell-model"
        src="cell.glb" 
        alt="3D Plant Cell Model"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
        
        <!-- 1. แวคิวโอลขนาดใหญ่ -->
        <button slot="hotspot-vacuole" class="hotspot-btn" data-position="-0.2 0.1 0.4" data-normal="0 0 1">
            <div class="hotspot-number">1</div>
            <div class="annotation-box">
                <div class="anno-name">แวคิวโอลขนาดใหญ่ (Central Vacuole)</div>
                <div class="anno-function">หน้าที่: กักเก็บน้ำ สารอาหาร และของเสีย</div>
                <div class="anno-desc">ถุงน้ำขนาดใหญ่สีฟ้า (หมายเลข 1) ที่กินพื้นที่เกือบครึ่งหนึ่งของเซลล์พืช ทำหน้าที่รักษาแรงดันเต่งให้น้ำในเซลล์สมดุล หากพืชขาดน้ำส่วนนี้จะหดตัวลงทำให้ใบไม้เหี่ยวเฉา</div>
            </div>
        </button>

        <!-- 2. นิวเคลียส -->
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="0.3 0.15 -0.1" data-normal="0 1 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">นิวเคลียส (Nucleus)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ (หมายเลข 2, 18, 19) เป็นที่กักเก็บ DNA ทำหน้าที่เหมือนห้องผู้บริหารที่สั่งการทุกกิจกรรมของเซลล์ ตั้งแต่การสังเคราะห์โปรตีนไปจนถึงกระบวนการแบ่งเซลล์</div>
            </div>
        </button>

        <!-- 3. คลอโรพลาสต์ -->
        <button slot="hotspot-chloroplast" class="hotspot-btn" data-position="-0.4 0.2 -0.2" data-normal="-1 0 0">
            <div class="hotspot-number">3</div>
            <div class="annotation-box">
                <div class="anno-name">คลอโรพลาสต์ (Chloroplast)</div>
                <div class="anno-function">หน้าที่: สร้างอาหารผ่านกระบวนการสังเคราะห์ด้วยแสง</div>
                <div class="anno-desc">ออร์แกเนลล์สีเขียว (หมายเลข 3, 4, 6, 7) ที่มีรงควัตถุคลอโรฟิลล์อยู่ด้านใน ทำหน้าที่ดูดกลืนพลังงานแสงอาทิตย์มาเปลี่ยนคาร์บอนไดออกไซด์และน้ำให้เป็นน้ำตาลเพื่อเป็นอาหาร</div>
            </div>
        </button>

        <!-- 4. กอลจิบอดี -->
        <button slot="hotspot-golgi" class="hotspot-btn" data-position="0.1 0.4 -0.3" data-normal="0 1 0">
            <div class="hotspot-number">5</div>
            <div class="annotation-box">
                <div class="anno-name">กอลจิบอดี (Golgi Apparatus)</div>
                <div class="anno-function">หน้าที่: เติมแต่ง บรรจุ และคัดแยกโปรตีนเพื่อส่งออก</div>
                <div class="anno-desc">กลุ่มถุงแบนสีน้ำเงินซ้อนกัน (หมายเลข 5, 8) ทำหน้าที่รับโปรตีนมาปรับแต่งรูปร่าง ห่อหุ้มใส่เวสิเคิล และจัดส่งไปยังจุดหมายปลายทาง คล้ายกับแผนกแพ็กและกระจายสินค้าของเซลล์</div>
            </div>
        </button>

        <!-- 5. ไมโทคอนเดรีย -->
        <button slot="hotspot-mitochondria" class="hotspot-btn" data-position="0.5 0.3 0.2" data-normal="1 0 0">
            <div class="hotspot-number">14</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-function">หน้าที่: สร้างพลังงานให้แก่เซลล์</div>
                <div class="anno-desc">โครงสร้างรูปไข่สีส้ม (หมายเลข 9, 10, 11, 14) ทำหน้าที่เผาผลาญสารอาหารร่วมกับแก๊สออกซิเจนให้กลายเป็นพลังงาน (ATP) เปรียบเสมือนโรงไฟฟ้าที่จ่ายไฟให้เซลล์ทำกิจกรรมต่างๆ ได้</div>
            </div>
        </button>

        <!-- 6. ผนังเซลล์ -->
        <button slot="hotspot-cellwall" class="hotspot-btn" data-position="-0.6 0 0" data-normal="-1 0 0">
            <div class="hotspot-number">12</div>
            <div class="annotation-box">
                <div class="anno-name">ผนังเซลล์ (Cell Wall)</div>
                <div class="anno-function">หน้าที่: ค้ำจุนโครงสร้างและรักษารูปทรง</div>
                <div class="anno-desc">โครงสร้างชั้นนอกสุดสีเขียว (หมายเลข 12) สร้างจากเซลลูโลส ทำหน้าที่เหมือนกำแพงป้องกันไม่ให้เซลล์แตกเมื่อมีน้ำออสโมซิสเข้ามา และทำให้เซลล์พืชมีรูปทรงเหลี่ยมคงที่</div>
            </div>
        </button>

        <!-- 7. ไซโทพลาซึม -->
        <button slot="hotspot-cytoplasm" class="hotspot-btn" data-position="0 0.5 0" data-normal="0 1 0">
            <div class="hotspot-number">13</div>
            <div class="annotation-box">
                <div class="anno-name">ไซโทพลาซึม (Cytoplasm)</div>
                <div class="anno-function">หน้าที่: พื้นที่เกิดปฏิกิริยาเคมีและที่อยู่ของออร์แกเนลล์</div>
                <div class="anno-desc">ของเหลวคล้ายเจล (หมายเลข 13) ที่กระจายอยู่เต็มเซลล์ ประกอบด้วยน้ำและสารละลาย เป็นเสมือนพื้นที่ว่างให้โครงสร้างอื่นๆ ลอยอยู่และดำเนินกระบวนการเคมีที่สำคัญต่อชีวิต</div>
            </div>
        </button>

        <!-- 8. ร่างแหเอนโดพลาซึม -->
        <button slot="hotspot-er" class="hotspot-btn" data-position="0.2 0 -0.2" data-normal="1 0 0">
            <div class="hotspot-number">15</div>
            <div class="annotation-box">
                <div class="anno-name">ร่างแหเอนโดพลาซึม (Endoplasmic Reticulum)</div>
                <div class="anno-function">หน้าที่: สร้างและลำเลียงโปรตีนและลิพิด</div>
                <div class="anno-desc">โครงสร้างท่อพับซ้อนกันอยู่รอบนิวเคลียส (หมายเลข 15, 16, 17) มีทั้งแบบขรุขระที่มีไรโบโซมเกาะเพื่อสร้างโปรตีน และแบบเรียบที่ช่วยสร้างไขมันและขจัดสารพิษ</div>
            </div>
        </button>

        <!-- 9. เยื่อหุ้มเซลล์ -->
        <button slot="hotspot-membrane" class="hotspot-btn" data-position="-0.55 0 0" data-normal="-1 0 0">
            <div class="hotspot-number">20</div>
            <div class="annotation-box">
                <div class="anno-name">เยื่อหุ้มเซลล์ (Cell Membrane)</div>
                <div class="anno-function">หน้าที่: ควบคุมการผ่านเข้าออกของสาร</div>
                <div class="anno-desc">เยื่อบางๆ ที่อยู่ติดกับผนังเซลล์ด้านใน ทำหน้าที่เป็นเยื่อเลือกผ่าน คอยคัดกรองสารอาหารและของเสียเข้าออก เพื่อรักษาสมดุลสภาพแวดล้อมภายในเซลล์ไม่ให้เปลี่ยนแปลงฉับพลัน</div>
            </div>
        </button>

        <!-- 10. ไรโบโซม -->
        <button slot="hotspot-ribosome" class="hotspot-btn" data-position="0.25 -0.1 -0.2" data-normal="0 -1 0">
            <div class="hotspot-number">21</div>
            <div class="annotation-box">
                <div class="anno-name">ไรโบโซม (Ribosome)</div>
                <div class="anno-function">หน้าที่: สังเคราะห์โปรตีน</div>
                <div class="anno-desc">เม็ดขนาดเล็กจิ๋วที่ลอยอยู่ในไซโทพลาซึมและเกาะบนร่างแหเอนโดพลาซึม ทำหน้าที่อ่านรหัสพันธุกรรมแล้วนำกรดอะมิโนมาประกอบเข้าด้วยกันเพื่อสร้างโปรตีนสำหรับใช้งานในเซลล์</div>
            </div>
        </button>

        <!-- ปุ่มสำหรับเข้าโหมด AR -->
        <button slot="ar-button" id="ar-button">
            👁️ ส่องเซลล์ทะลุจอ (AR Mode)
        </button>
        
    </model-viewer>

    <!-- สคริปต์คลิกหาพิกัด -->
    <script>
        const modelViewer = document.querySelector('#cell-model');
        const coordValue = document.querySelector('#coord-value');
        const copyStatus = document.querySelector('#copy-status');

        modelViewer.addEventListener('click', (event) => {
            const hit = modelViewer.positionAndNormalFromPoint(event.clientX, event.clientY);
            
            if (hit) {
                const x = hit.position.x.toFixed(2);
                const y = hit.position.y.toFixed(2);
                const z = hit.position.z.toFixed(2);
                
                const resultString = `data-position="${x} ${y} ${z}"`;
                
                coordValue.innerText = resultString;
                
                navigator.clipboard.writeText(resultString).then(() => {
                    copyStatus.innerText = "📋 คัดลอกลงคลิปบอร์ดเรียบร้อยแล้ว! (กด Ctrl+V วางได้เลย)";
                    setTimeout(() => { copyStatus.innerText = ""; }, 3000);
                });
            }
        });
    </script>
</body>
</html>
