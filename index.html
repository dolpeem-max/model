<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือหาพิกัด 3D Model</title>
    
    <!-- โหลดโมดูล model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
    
        
        /* ตั้งค่ากล่อง 3 มิติ */
        model-viewer {
            width: 100vw;
            height: 70vh;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* ตั้งค่าแผงควบคุมและแสดงผลด้านล่าง */
    



    
        #coordinate-box:active {
            transform: scale(0.98);
        }

        /* ตกแต่งปุ่ม Hotspot เบื้องต้น (ซ่อนรายละเอียดไว้ก่อนคลิก) */
        .hotspot-btn {
            background: #fff;
            border-radius: 50%;
            border: 2px solid #1a73e8;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .hotspot-number {
            font-weight: bold;
            color: #1a73e8;
        }

        .annotation-box {
            display: none; /* ซ่อนกล่องข้อความไว้ */
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            width: 250px;
            text-align: left;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 100;
        }

        .hotspot-btn:focus .annotation-box,
        .hotspot-btn:hover .annotation-box {
            display: block; /* แสดงกล่องเมื่อชี้หรือคลิก */
        }

        .anno-name { font-weight: bold; margin-bottom: 5px; color: #333; }
        .anno-function { font-size: 0.85em; color: #1a73e8; margin-bottom: 5px; }
        .anno-desc { font-size: 0.8em; color: #666; line-height: 1.4; }

        #ar-button {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- แสดงผลโมเดล 3 มิติ -->
    <model-viewer 
        id="cell-model" 
        src="scene.gltf" 
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
        
        <!-- 1. แวคคิวโอล -->
        <button slot="hotspot-vacuole" class="hotspot-btn" data-position="2.0165 0.0569 0.0153" data-normal="0 1 0">
            <div class="hotspot-number">6</div>
            <div class="annotation-box">
                <div class="anno-name">แวคคิวโอล (Vacuole)</div>
                <div class="anno-function">หน้าที่: เก็บสะสมน้ำ สารอาหาร และกักเก็บของเสีย</div>
                <div class="anno-desc">เป็นถุง มีเยื่อหุ้มเพียงชั้นเดียว ภายในบรรจุของเหลว สำหรับในเซลล์สัตว์ ถุงแวคิวโอลจะมีขนาดเล็กมาก ซึ่งจะกระจายอยู่ทั่วไป หรือบางครั้งอาจไม่พบเลย</div>
            </div>
        </button>
        
        <!-- 2. นิวเคลียส -->
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="-0.2713 1.0841 -0.6872" data-normal="0 1 0">
            <div class="hotspot-number">4</div>
            <div class="annotation-box">
                <div class="anno-name">นิวเคลียส (Nucleus)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div> 
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ เป็นที่กักเก็บ DNA ทำหน้าที่เหมือนห้องผู้บริหารที่สั่งการทุกกิจกรรมของเซลล์ ตั้งแต่การสังเคราะห์โปรตีนไปจนถึงกระบวนการแบ่งเซลล์</div>
            </div>
        </button>

        <!-- 3. ไมโทคอนเดรีย -->
        <button slot="hotspot-mitochondria" class="hotspot-btn" data-position="-0.6102 0.2127 3.2523" data-normal="1 0 0">
            <div class="hotspot-number">5</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-function">หน้าที่: สร้างพลังงานให้แก่เซลล์</div>
                <div class="anno-desc">โครงสร้างรูปไข่ หรือทรงรี ทำหน้าที่เผาผลาญสารอาหารร่วมกับแก๊สออกซิเจนให้กลายเป็นพลังงาน (ATP) เปรียบเสมือนโรงไฟฟ้าที่จ่ายไฟให้เซลล์ทำกิจกรรมต่างๆ ได้</div>
            </div>
        </button>

        <!-- 4. ไซโทพลาซึม -->
        <button slot="hotspot-cytoplasm" class="hotspot-btn" data-position="-2.5609 -0.0704 -0.7362" data-normal="0 1 0">
            <div class="hotspot-number">3</div>
            <div class="annotation-box">
                <div class="anno-name">ไซโทพลาซึม (Cytoplasm)</div>
                <div class="anno-function">หน้าที่: พื้นที่เกิดปฏิกิริยาเคมีและที่อยู่ของออร์แกเนลล์</div>
                <div class="anno-desc">ของเหลวคล้ายเจล ที่กระจายอยู่เต็มเซลล์ ประกอบด้วยน้ำและสารละลาย เป็นเสมือนพื้นที่ว่างให้โครงสร้างอื่นๆ ลอยอยู่และดำเนินกระบวนการเคมีที่สำคัญต่อชีวิต</div>
            </div>
        </button>

        <!-- 5. เยื่อหุ้มเซลล์ -->
        <button slot="hotspot-membrane" class="hotspot-btn" data-position="-3.1590 -0.1410 -0.7389" data-normal="-1 0 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">เยื่อหุ้มเซลล์ (Cell Membrane)</div>
                <div class="anno-function">หน้าที่: ควบคุมการผ่านเข้าออกของสาร</div>
                <div class="anno-desc">เยื่อบางๆ ที่อยู่ติดกับผนังเซลล์ด้านใน ทำหน้าที่เป็นเยื่อเลือกผ่าน คอยคัดกรองสารอาหารและของเสียเข้าออก เพื่อรักษาสมดุลสภาพแวดล้อมภายในเซลล์ไม่ให้เปลี่ยนแปลงฉับพลัน</div>
            </div>
        </button>

         <button slot="ar-button" id="ar-button">
            👁️ ส่องเซลล์ทะลุจอ (AR Mode)
        </button>
    </model-viewer>

</body>
</html>
