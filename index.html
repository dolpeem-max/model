<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Plant Cell Explorer</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #2b2b2b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* ปุ่ม AR ด้านล่าง */
        #ar-button {
            background-color: #ffffff;
            color: #333;
            border-radius: 20px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }

        /* การตกแต่งปุ่มตัวเลข (Hotspot) */
        .hotspot-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }

        /* บังคับไม่ให้ปุ่มจางลงและดันให้อยู่หน้าสุดเมื่อถูกโฟกัสหรือชี้ */
        .hotspot-btn:focus,
        .hotspot-btn:hover {
            opacity: 1 !important;
            visibility: visible !important;
            z-index: 9999 !important;
        }

        .hotspot-number {
            background-color: rgba(40, 40, 50, 0.9);
            color: white;
            border: 1px solid #aaa;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        /* กล่องคำอธิบายสีเข้ม (Annotation Box) */
        .annotation-box {
            background-color: rgba(20, 20, 25, 0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            width: 250px; /* ขยายความกว้างเล็กน้อยเพื่อให้พอดีกับคำอธิบายยาว */
            text-align: left;
            position: absolute;
            top: 50%;
            left: 40px; 
            transform: translateY(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 9999; /* ดันกล่องคำอธิบายขึ้นมาอยู่หน้าสุด */
        }

        /* เมื่อคลิกหรือเอาเมาส์ชี้ที่ตัวเลข ให้โชว์กล่องข้อความอย่างเด่นชัด */
        .hotspot-btn:focus .annotation-box,
        .hotspot-btn:hover .annotation-box {
            opacity: 1 !important;
            visibility: visible !important;
        }

        /* การจัดรูปแบบข้อความ 3 บรรทัด */
        .anno-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .anno-function {
            font-size: 13px;
            font-weight: bold;
            color: #4da6ff; 
            margin-bottom: 5px;
        }
        .anno-desc {
            font-size: 12px;
            line-height: 1.5;
            color: #dcdcdc;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="cell.glb" 
        alt="3D Plant Cell Model"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
        
        <button slot="hotspot-vacuole" class="hotspot-btn" data-position="11.81 19.67 -66.23" data-normal="0 0 1">
            <div class="hotspot-number">6</div>
            <div class="annotation-box">
                <div class="anno-name">แวคิวโอลขนาดใหญ่ (Central Vacuole)</div>
                <div class="anno-desc">ถุงน้ำขนาดใหญ่สีฟ้า ที่กินพื้นที่เกือบครึ่งหนึ่งของเซลล์พืช ทำหน้าที่รักษาแรงดันเต่งให้น้ำในเซลล์สมดุล หากพืชขาดน้ำส่วนนี้จะหดตัวลงทำให้ใบไม้เหี่ยวเฉา</div>
                <div class="anno-function">หน้าที่: กักเก็บน้ำ สารอาหาร และของเสีย</div>
            </div>
        </button>

        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="69.09 -2.85 43.91" data-normal="0 1 0">
            <div class="hotspot-number">4</div>
            <div class="annotation-box">
                <div class="anno-name">นิวเคลียส (Nucleus)</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ เป็นที่กักเก็บ DNA ทำหน้าที่เหมือนห้องผู้บริหารที่สั่งการทุกกิจกรรมของเซลล์ ตั้งแต่การสังเคราะห์โปรตีนไปจนถึงกระบวนการแบ่งเซลล์</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div>
            </div>
        </button>

        <button slot="hotspot-chloroplast" class="hotspot-btn" data-position="-58.41 -11.22 60.29" data-normal="-1 0 0">
            <div class="hotspot-number">7</div>
            <div class="annotation-box">
                <div class="anno-name">คลอโรพลาสต์ (Chloroplast)</div>
                <div class="anno-desc">ออร์แกเนลล์สีเขียว ที่มีรงควัตถุคลอโรฟิลล์อยู่ด้านใน ทำหน้าที่ดูดกลืนพลังงานแสงอาทิตย์มาเปลี่ยนคาร์บอนไดออกไซด์และน้ำให้เป็นน้ำตาลเพื่อเป็นอาหาร</div>
                <div class="anno-function">หน้าที่: สร้างอาหารผ่านกระบวนการสังเคราะห์ด้วยแสง</div>
            </div>
        </button>

        <button slot="hotspot-mitochondria" class="hotspot-btn" data-position="145.03 -10.81 55.82" data-normal="1 0 0">
            <div class="hotspot-number">5</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-desc">โครงสร้างรูปไข่สีส้ม ทำหน้าที่เผาผลาญสารอาหารร่วมกับแก๊สออกซิเจนให้กลายเป็นพลังงาน (ATP) เปรียบเสมือนโรงไฟฟ้าที่จ่ายไฟให้เซลล์ทำกิจกรรมต่างๆ ได้</div>
                <div class="anno-function">หน้าที่: สร้างพลังงานให้แก่เซลล์</div>
            </div>
        </button>

        <button slot="hotspot-cellwall" class="hotspot-btn" data-position="172.50 -39.25 -104.01" data-normal="-1 0 0">
            <div class="hotspot-number">1</div>
            <div class="annotation-box">
                <div class="anno-name">ผนังเซลล์ (Cell Wall)</div>
                <div class="anno-desc">โครงสร้างชั้นนอกสุดสีเขียว สร้างจากเซลลูโลส ทำหน้าที่เหมือนกำแพงป้องกันไม่ให้เซลล์แตกเมื่อมีน้ำออสโมซิสเข้ามา และทำให้เซลล์พืชมีรูปทรงเหลี่ยมคงที่</div>
                <div class="anno-function">หน้าที่: ค้ำจุนโครงสร้างและรักษารูปทรง</div> 
            </div>
        </button>

        <button slot="hotspot-cytoplasm" class="hotspot-btn" data-position="143.72 -20.75 -88.43" data-normal="0 1 0">
            <div class="hotspot-number">3</div>
            <div class="annotation-box">
                <div class="anno-name">ไซโทพลาซึม (Cytoplasm)</div>
                <div class="anno-desc">ของเหลวคล้ายเจล ที่กระจายอยู่เต็มเซลล์ ประกอบด้วยน้ำและสารละลาย เป็นเสมือนพื้นที่ว่างให้โครงสร้างอื่นๆ ลอยอยู่และดำเนินกระบวนการเคมีที่สำคัญต่อชีวิต</div>
                <div class="anno-function">หน้าที่: พื้นที่เกิดปฏิกิริยาเคมีและที่อยู่ของออร์แกเนลล์</div>
            </div>
        </button>

        <button slot="hotspot-membrane" class="hotspot-btn" data-position="-92.31 -21.03 -35.53" data-normal="-1 0 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">เยื่อหุ้มเซลล์ (Cell Membrane)</div>
                <div class="anno-desc">เยื่อบางๆ ที่อยู่ติดกับผนังเซลล์ด้านใน ทำหน้าที่เป็นเยื่อเลือกผ่าน คอยคัดกรองสารอาหารและของเสียเข้าออก เพื่อรักษาสมดุลสภาพแวดล้อมภายในเซลล์ไม่ให้เปลี่ยนแปลงฉับพลัน</div>
                <div class="anno-function">หน้าที่: ควบคุมการผ่านเข้าออกของสาร</div>
            </div>
        </button>

        <button slot="ar-button" id="ar-button">
            👁️ ส่องเซลล์ทะลุจอ (AR Mode)
        </button>
        
    </model-viewer>

</body>
</html>
