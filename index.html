<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Animal Cell Explorer</title>
    
    <script type="module" src="cell_2.glb"></script>
    
    <style>
        body { margin: 0; background-color: #2b2b2b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* ปุ่ม AR ด้านล่าง */
        #ar-button {
            background-color: #ffffff;
            color: #333;
            border-radius: 20px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }

        /* การตกแต่งปุ่มตัวเลข (Hotspot) */
        .hotspot-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }

        .hotspot-number {
            background-color: rgba(40, 40, 50, 0.9);
            color: white;
            border: 1px solid #aaa;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        /* กล่องคำอธิบายสีเข้ม (Annotation Box) */
        .annotation-box {
            background-color: rgba(20, 20, 25, 0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            width: 250px;
            text-align: left;
            position: absolute;
            top: 50%;
            left: 40px; 
            transform: translateY(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 5;
        }

        /* เมื่อคลิกหรือเอาเมาส์ชี้ที่ตัวเลข ให้โชว์กล่องข้อความ */
        .hotspot-btn:focus .annotation-box,
        .hotspot-btn:hover .annotation-box {
            opacity: 1;
            visibility: visible;
        }

        /* การจัดรูปแบบข้อความ 3 บรรทัด */
        .anno-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .anno-function {
            font-size: 13px;
            font-weight: bold;
            color: #4da6ff; 
            margin-bottom: 5px;
        }
        .anno-desc {
            font-size: 12px;
            line-height: 1.5;
            color: #dcdcdc;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="animal_cell.glb" 
        alt="3D Animal Cell Model"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
        
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="0 0 0" data-normal="0 1 0">
            <div class="hotspot-number">1</div>
            <div class="annotation-box">
                <div class="anno-name">นิวเคลียส (Nucleus)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ เป็นที่กักเก็บ DNA ทำหน้าที่เหมือนห้องผู้บริหารที่สั่งการทุกกิจกรรมของเซลล์ ตั้งแต่การสังเคราะห์โปรตีนไปจนถึงกระบวนการแบ่งเซลล์</div>
            </div>
        </button>

        <button slot="hotspot-membrane" class="hotspot-btn" data-position="0 0 0" data-normal="-1 0 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">เยื่อหุ้มเซลล์ (Cell Membrane)</div>
                <div class="anno-function">หน้าที่: ควบคุมการผ่านเข้าออกของสาร</div>
                <div class="anno-desc">เยื่อบางๆ ที่ห่อหุ้มเซลล์สัตว์ไว้ (ไม่มีผนังเซลล์แบบพืช) ทำหน้าที่เป็นเยื่อเลือกผ่าน คอยคัดกรองสารอาหารและของเสียเข้าออก เพื่อรักษาสมดุลสภาพแวดล้อมภายในเซลล์</div>
            </div>
        </button>

        <button slot="hotspot-cytoplasm" class="hotspot-btn" data-position="0 0 0" data-normal="0 1 0">
            <div class="hotspot-number">3</div>
            <div class="annotation-box">
                <div class="anno-name">ไซโทพลาซึม (Cytoplasm)</div>
                <div class="anno-function">หน้าที่: พื้นที่เกิดปฏิกิริยาเคมีและที่อยู่ของออร์แกเนลล์</div>
                <div class="anno-desc">ของเหลวคล้ายเจล ที่กระจายอยู่เต็มเซลล์ ประกอบด้วยน้ำและสารละลาย เป็นเสมือนพื้นที่ว่างให้โครงสร้างอื่นๆ ลอยอยู่และดำเนินกระบวนการเคมีที่สำคัญต่อชีวิต</div>
            </div>
        </button>

        <button slot="hotspot-mitochondria" class="hotspot-btn" data-position="0 0 0" data-normal="1 0 0">
            <div class="hotspot-number">4</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-function">หน้าที่: สร้างพลังงานให้แก่เซลล์</div>
                <div class="anno-desc">โครงสร้างรูปไข่ ทำหน้าที่เผาผลาญสารอาหารร่วมกับแก๊สออกซิเจนให้กลายเป็นพลังงาน (ATP) เปรียบเสมือนโรงไฟฟ้าที่จ่ายไฟให้เซลล์ทำกิจกรรมต่างๆ ได้</div>
            </div>
        </button>

        <button slot="hotspot-golgi" class="hotspot-btn" data-position="0 0 0" data-normal="0 1 0">
            <div class="hotspot-number">5</div>
            <div class="annotation-box">
                <div class="anno-name">กอลจิบอดี (Golgi Apparatus)</div>
                <div class="anno-function">หน้าที่: เติมแต่ง บรรจุ และคัดแยกโปรตีนเพื่อส่งออก</div>
                <div class="anno-desc">กลุ่มถุงแบนซ้อนกัน ทำหน้าที่รับโปรตีนมาปรับแต่งรูปร่าง ห่อหุ้มใส่เวสิเคิล และจัดส่งไปยังจุดหมายปลายทาง คล้ายกับแผนกแพ็กและกระจายสินค้าของเซลล์</div>
            </div>
        </button>

        <button slot="hotspot-er" class="hotspot-btn" data-position="0 0 0" data-normal="1 0 0">
            <div class="hotspot-number">6</div>
            <div class="annotation-box">
                <div class="anno-name">ร่างแหเอนโดพลาซึม (Endoplasmic Reticulum)</div>
                <div class="anno-function">หน้าที่: สร้างและลำเลียงโปรตีนและลิพิด</div>
                <div class="anno-desc">โครงสร้างเป็นท่อหรือถุงแบนพับซ้อนกันอยู่รอบนิวเคลียส ชนิดขรุขระ(มีไรโบโซมเกาะ)ทำหน้าที่สร้างและส่งโปรตีน ส่วนชนิดเรียบทำหน้าที่สร้างลิพิดและกำจัดสารพิษ</div>
            </div>
        </button>

        <button slot="hotspot-ribosome" class="hotspot-btn" data-position="0 0 0" data-normal="0 -1 0">
            <div class="hotspot-number">7</div>
            <div class="annotation-box">
                <div class="anno-name">ไรโบโซม (Ribosome)</div>
                <div class="anno-function">หน้าที่: สังเคราะห์โปรตีน</div>
                <div class="anno-desc">เม็ดขนาดเล็กจิ๋วที่ลอยอยู่ในไซโทพลาซึมและเกาะบนร่างแหเอนโดพลาซึม ทำหน้าที่อ่านรหัสพันธุกรรมแล้วนำกรดอะมิโนมาประกอบเข้าด้วยกันเพื่อสร้างโปรตีนสำหรับใช้งานในเซลล์</div>
            </div>
        </button>

        <button slot="hotspot-lysosome" class="hotspot-btn" data-position="0 0 0" data-normal="1 0 0">
            <div class="hotspot-number">8</div>
            <div class="annotation-box">
                <div class="anno-name">ไลโซโซม (Lysosome)</div>
                <div class="anno-function">หน้าที่: ย่อยสลายสารอาหารและสิ่งแปลกปลอม</div>
                <div class="anno-desc">ถุงขนาดเล็กที่บรรจุเอนไซม์สำหรับย่อยสลายอนุภาคอาหาร แบคทีเรีย หรือออร์แกเนลล์ที่เสื่อมสภาพ เปรียบเสมือนพนักงานทำความสะอาดและกำจัดขยะของเซลล์ (พบมากในเซลล์สัตว์)</div>
            </div>
        </button>

        <button slot="hotspot-centriole" class="hotspot-btn" data-position="0 0 0" data-normal="-1 0 0">
            <div class="hotspot-number">9</div>
            <div class="annotation-box">
                <div class="anno-name">เซนทริโอล (Centriole)</div>
                <div class="anno-function">หน้าที่: ช่วยในการแบ่งเซลล์</div>
                <div class="anno-desc">โครงสร้างรูปทรงกระบอกที่พบในเซลล์สัตว์ ทำหน้าที่สร้างเส้นใยสปินเดิลเพื่อดึงโครโมโซมให้แยกออกจากกันขณะที่เซลล์กำลังแบ่งตัว</div>
            </div>
        </button>

        <button slot="hotspot-vacuole" class="hotspot-btn" data-position="0 0 0" data-normal="0 0 1">
            <div class="hotspot-number">10</div>
            <div class="annotation-box">
                <div class="anno-name">แวคิวโอล (Vacuole)</div>
                <div class="anno-function">หน้าที่: กักเก็บสารต่างๆ</div>
                <div class="anno-desc">ถุงขนาดเล็กที่ทำหน้าที่เก็บน้ำ สารอาหาร หรือของเสีย ในเซลล์สัตว์แวคิวโอลจะมีขนาดเล็กและมีจำนวนกระจายอยู่ทั่วไป แตกต่างจากเซลล์พืชที่มีขนาดใหญ่เพียงอันเดียว</div>
            </div>
        </button>

        <button slot="ar-button" id="ar-button">
            👁️ ส่องเซลล์ทะลุจอ (AR Mode)
        </button>
        
    </model-viewer>

</body>
</html>
