<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือหาพิกัด 3D Model</title>
    
    <!-- โหลดโมดูล model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
        }
        
        /* ตั้งค่ากล่อง 3 มิติ */
        model-viewer {
            width: 100vw;
            height: 70vh;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* ตั้งค่าแผงควบคุมและแสดงผลด้านล่าง */
        .panel {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .instruction {
            color: #5f6368;
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        /* กล่องสำหรับแสดงพิกัดที่คลิกได้ */
        #coordinate-box {
            font-size: 1.2em;
            font-family: monospace;
            color: #1a73e8;
            font-weight: bold;
            padding: 15px;
            background: #e8f0fe;
            border: 2px dashed #1a73e8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #coordinate-box:hover {
            background: #d2e3fc;
        }

        #coordinate-box:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- แสดงผลโมเดล 3 มิติ -->
    <model-viewer 
        id="cell-model" 
        src="scene.gltf" 
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
        
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="69.09 -2.85 43.91" data-normal="0 1 0">
            <div class="hotspot-number">6</div>
            <div class="annotation-box">
                <div class="anno-name"> แวคคิวโอล (Vacuole)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ เป็นที่กักเก็บ DNA ทำหน้าที่เหมือนห้องผู้บริหารที่สั่งการทุกกิจกรรมของเซลล์ ตั้งแต่การสังเคราะห์โปรตีนไปจนถึงกระบวนการแบ่งเซลล์</div>
            </div>
        </button>
        
        <!-- 2. นิวเคลียส -->
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="69.09 -2.85 43.91" data-normal="0 1 0">
            <div class="hotspot-number">4</div>
            <div class="annotation-box">
                <div class="anno-name"> นิวเคลียส (Nucleus)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ เป็นที่กักเก็บ DNA ทำหน้าที่เหมือนห้องผู้บริหารที่สั่งการทุกกิจกรรมของเซลล์ ตั้งแต่การสังเคราะห์โปรตีนไปจนถึงกระบวนการแบ่งเซลล์</div>
            </div>
        </button>

        <!-- 5. ไมโทคอนเดรีย -->
        <button slot="hotspot-mitochondria" class="hotspot-btn" data-position="145.03 -10.81 55.82" data-normal="1 0 0">
            <div class="hotspot-number">5</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-function">หน้าที่: สร้างพลังงานให้แก่เซลล์</div>
                <div class="anno-desc">โครงสร้างรูปไข่สีส้ม ทำหน้าที่เผาผลาญสารอาหารร่วมกับแก๊สออกซิเจนให้กลายเป็นพลังงาน (ATP) เปรียบเสมือนโรงไฟฟ้าที่จ่ายไฟให้เซลล์ทำกิจกรรมต่างๆ ได้</div>
            </div>
        </button>

        <!-- 7. ไซโทพลาซึม -->
        <button slot="hotspot-cytoplasm" class="hotspot-btn" data-position="143.72 -20.75 -88.43" data-normal="0 1 0">
            <div class="hotspot-number">3</div>
            <div class="annotation-box">
                <div class="anno-name">ไซโทพลาซึม (Cytoplasm)</div>
                <div class="anno-function">หน้าที่: พื้นที่เกิดปฏิกิริยาเคมีและที่อยู่ของออร์แกเนลล์</div>
                <div class="anno-desc">ของเหลวคล้ายเจล ที่กระจายอยู่เต็มเซลล์ ประกอบด้วยน้ำและสารละลาย เป็นเสมือนพื้นที่ว่างให้โครงสร้างอื่นๆ ลอยอยู่และดำเนินกระบวนการเคมีที่สำคัญต่อชีวิต</div>
            </div>
        </button>

        <!-- 9. เยื่อหุ้มเซลล์ (สมมติเป็นหมายเลข 20 เพื่อให้เข้ากับระบบ UI) -->
        <button slot="hotspot-membrane" class="hotspot-btn" data-position="-92.31 -21.03 -35.53" data-normal="-1 0 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">เยื่อหุ้มเซลล์ (Cell Membrane)</div>
                <div class="anno-function">หน้าที่: ควบคุมการผ่านเข้าออกของสาร</div>
                <div class="anno-desc">เยื่อบางๆ ที่อยู่ติดกับผนังเซลล์ด้านใน ทำหน้าที่เป็นเยื่อเลือกผ่าน คอยคัดกรองสารอาหารและของเสียเข้าออก เพื่อรักษาสมดุลสภาพแวดล้อมภายในเซลล์ไม่ให้เปลี่ยนแปลงฉับพลัน</div>
            </div>
        </button>

         <button slot="ar-button" id="ar-button">
            👁️ ส่องเซลล์ทะลุจอ (AR Mode)
        </button>
    </div>

    <!-- โค้ดประมวลผล -->
    <script>
        const modelViewer = document.querySelector('#cell-model');
        const coordBox = document.querySelector('#coordinate-box');

        modelViewer.addEventListener('click', (event) => {
            // ดึงพิกัดการคลิกบนหน้าจอ
            const rect = modelViewer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // แปลงพิกัดหน้าจอเป็นพิกัด 3 มิติบนโมเดล
            const hit = modelViewer.positionAndNormalFromPoint(x, y);

            if (hit != null) {
                // ปัดเศษทศนิยมให้ดูสะอาดตา
                const px = hit.position.x.toFixed(4);
                const py = hit.position.y.toFixed(4);
                const pz = hit.position.z.toFixed(4);
                
                // สร้างชุดข้อความพิกัด
                const positionData = `${px} ${py} ${pz}`;
                coordBox.innerText = `data-position="${positionData}"`;
                
                // ฟังก์ชันกดแล้วคัดลอกอัตโนมัติ
                coordBox.onclick = () => {
                    navigator.clipboard.writeText(`data-position="${positionData}"`);
                    const originalText = coordBox.innerText;
                    coordBox.innerText = "✅ คัดลอกพิกัดเรียบร้อยแล้ว!";
                    coordBox.style.backgroundColor = "#ceead6";
                    coordBox.style.borderColor = "#188038";
                    coordBox.style.color = "#188038";
                    
                    setTimeout(() => {
                        coordBox.innerText = originalText;
                        coordBox.style.backgroundColor = "#e8f0fe";
                        coordBox.style.borderColor = "#1a73e8";
                        coordBox.style.color = "#1a73e8";
                    }, 1500);
                };
            } else {
                coordBox.innerText = "ไม่ได้คลิกโดนชิ้นส่วนโมเดล ลองใหม่อีกครั้งครับ";
                coordBox.onclick = null;
            }
        });
    </script>

</body>
</html>
