<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Cell</title>
    
    <!-- เรียกใช้งานไลบรารี model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #1e1e24; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* ปุ่มสำหรับผู้พัฒนา (คลิกเพื่อหาพิกัด) */
        #dev-helper {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #00ffcc;
            padding: 10px; border-radius: 8px; font-size: 12px; z-index: 100; font-family: monospace;
        }

        /* ปุ่ม AR ด้านล่าง */
        #ar-button {
            background-color: #ffffff; color: #333; border-radius: 20px; border: none;
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body>

    <!-- กล่องแสดงพิกัดสำหรับ Developer -->
    <div id="dev-helper">คลิกบนโมเดลเพื่อหาพิกัด X Y Z<br><span id="coords">ยังไม่ได้คลิก</span></div>

    <!-- โหลดโมเดลเซลล์ (แก้ไขชื่อไฟล์เป็น cell.glb ตามที่ต้องการ) -->
    <model-viewer 
        id="cell-model" 
        src="cell.glb" 
        alt="3D Cell Model" 
        camera-controls 
        auto-rotate 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">
            👁️ ดูโมเดล AR
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#cell-model');
        const coordSpan = document.querySelector('#coords');

        // สคริปต์หาพิกัดเมื่อคลิกบนโมเดล
        modelViewer.addEventListener('click', (event) => {
            const hit = modelViewer.positionAndNormalFromPoint(event.clientX, event.clientY);
            
            if (hit) {
                const x = hit.position.x.toFixed(2);
                const y = hit.position.y.toFixed(2);
                const z = hit.position.z.toFixed(2);
                
                const resultString = `data-position="${x} ${y} ${z}"`;
                coordSpan.innerText = resultString;
                
                // คัดลอกลงคลิปบอร์ดอัตโนมัติ
                navigator.clipboard.writeText(resultString).then(() => {
                    const originalText = coordSpan.innerText;
                    coordSpan.innerText = resultString + " (คัดลอกแล้ว!)";
                    setTimeout(() => { coordSpan.innerText = originalText; }, 2000);
                });
            }
        });
    </script>

</body>
</html>
