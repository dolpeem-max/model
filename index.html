<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือหาพิกัด 3D Model</title>
    
    <!-- โหลดโมดูล model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
        }
        
        /* ตั้งค่ากล่อง 3 มิติ */
        model-viewer {
            width: 100vw;
            height: 70vh;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* ตั้งค่าแผงควบคุมและแสดงผลด้านล่าง */
        .panel {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .instruction {
            color: #5f6368;
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        /* กล่องสำหรับแสดงพิกัดที่คลิกได้ */
        #coordinate-box {
            font-size: 1.2em;
            font-family: monospace;
            color: #1a73e8;
            font-weight: bold;
            padding: 15px;
            background: #e8f0fe;
            border: 2px dashed #1a73e8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #coordinate-box:hover {
            background: #d2e3fc;
        }

        #coordinate-box:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- แสดงผลโมเดล 3 มิติ -->
    <model-viewer 
        id="cell-model" 
        src="scene.gltf" 
        camera-controls 
        auto-rotate
        shadow-intensity="1">
    </model-viewer>

    <!-- ส่วนแสดงพิกัด -->
    <div class="panel">
        <div class="instruction">
            <b>วิธีใช้งาน:</b> หมุน/ซูม โมเดลเพื่อหาจุดที่ต้องการ จากนั้นคลิกที่ชิ้นส่วนนั้นๆ <br>
            พิกัด X Y Z จะปรากฏขึ้นด้านล่าง (คลิกที่กล่องสีฟ้าเพื่อคัดลอกทันที)
        </div>
        
        <div id="coordinate-box" title="คลิกเพื่อคัดลอก">
            รอการคลิกที่โมเดล...
        </div>
    </div>

    <!-- โค้ดประมวลผล -->
    <script>
        const modelViewer = document.querySelector('#cell-model');
        const coordBox = document.querySelector('#coordinate-box');

        modelViewer.addEventListener('click', (event) => {
            // ดึงพิกัดการคลิกบนหน้าจอ
            const rect = modelViewer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // แปลงพิกัดหน้าจอเป็นพิกัด 3 มิติบนโมเดล
            const hit = modelViewer.positionAndNormalFromPoint(x, y);

            if (hit != null) {
                // ปัดเศษทศนิยมให้ดูสะอาดตา
                const px = hit.position.x.toFixed(4);
                const py = hit.position.y.toFixed(4);
                const pz = hit.position.z.toFixed(4);
                
                // สร้างชุดข้อความพิกัด
                const positionData = `${px} ${py} ${pz}`;
                coordBox.innerText = `data-position="${positionData}"`;
                
                // ฟังก์ชันกดแล้วคัดลอกอัตโนมัติ
                coordBox.onclick = () => {
                    navigator.clipboard.writeText(`data-position="${positionData}"`);
                    const originalText = coordBox.innerText;
                    coordBox.innerText = "✅ คัดลอกพิกัดเรียบร้อยแล้ว!";
                    coordBox.style.backgroundColor = "#ceead6";
                    coordBox.style.borderColor = "#188038";
                    coordBox.style.color = "#188038";
                    
                    setTimeout(() => {
                        coordBox.innerText = originalText;
                        coordBox.style.backgroundColor = "#e8f0fe";
                        coordBox.style.borderColor = "#1a73e8";
                        coordBox.style.color = "#1a73e8";
                    }, 1500);
                };
            } else {
                coordBox.innerText = "ไม่ได้คลิกโดนชิ้นส่วนโมเดล ลองใหม่อีกครั้งครับ";
                coordBox.onclick = null;
            }
        });
    </script>

</body>
</html>
