<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Animal Cell Explorer</title>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            background-color: #2b2b2b; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
        }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* ปุ่ม AR ด้านล่าง */
        #ar-button {
            background-color: #ffffff;
            color: #333;
            border-radius: 20px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }

        /* การตกแต่งปุ่มตัวเลข (Hotspot) */
        .hotspot-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }

        .hotspot-number {
            background-color: rgba(40, 40, 50, 0.9);
            color: white;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .hotspot-btn:hover .hotspot-number,
        .hotspot-btn:focus .hotspot-number {
            background-color: #4da6ff;
            transform: scale(1.15);
        }

        /* กล่องคำอธิบายสีเข้ม (Annotation Box) */
        .annotation-box {
            background-color: rgba(20, 20, 25, 0.92);
            color: white;
            padding: 15px;
            border-radius: 8px;
            width: 250px;
            text-align: left;
            position: absolute;
            top: 50%;
            left: 42px; 
            transform: translateY(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* แสดงกล่องข้อความเมื่อ Hover หรือ Click/Focus */
        .hotspot-btn:focus .annotation-box,
        .hotspot-btn:hover .annotation-box {
            opacity: 1;
            visibility: visible;
        }

        /* การจัดรูปแบบข้อความ */
        .anno-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ffffff;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .anno-function {
            font-size: 12px;
            font-weight: bold;
            color: #4da6ff; 
            margin-bottom: 5px;
        }
        .anno-desc {
            font-size: 11px;
            line-height: 1.4;
            color: #dcdcdc;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="cell_2.glb" 
        alt="3D Animal Cell Model"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
        
        <button slot="hotspot-nucleus" class="hotspot-btn" data-position="0 0.1 0" data-normal="0 1 0">
            <div class="hotspot-number">1</div>
            <div class="annotation-box">
                <div class="anno-name">นิวเคลียส (Nucleus)</div>
                <div class="anno-function">หน้าที่: ศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม</div>
                <div class="anno-desc">โครงสร้างทรงกลมขนาดใหญ่ เป็นที่กักเก็บ DNA ทำหน้าที่ควบคุมกิจกรรมทั้งหมดของเซลล์</div>
            </div>
        </button>

        <button slot="hotspot-membrane" class="hotspot-btn" data-position="-0.8 0 0.3" data-normal="-1 0 0">
            <div class="hotspot-number">2</div>
            <div class="annotation-box">
                <div class="anno-name">เยื่อหุ้มเซลล์ (Cell Membrane)</div>
                <div class="anno-function">หน้าที่: ควบคุมการผ่านเข้าออกของสาร</div>
                <div class="anno-desc">เยื่อบางๆ ที่ห่อหุ้มเซลล์สัตว์ ทำหน้าที่เป็นเยื่อเลือกผ่าน คอยคัดกรองสารอาหารและของเสีย</div>
            </div>
        </button>

        <button slot="hotspot-cytoplasm" class="hotspot-btn" data-position="0.5 -0.3 0.4" data-normal="0 1 0">
            <div class="hotspot-number">3</div>
            <div class="annotation-box">
                <div class="anno-name">ไซโทพลาซึม (Cytoplasm)</div>
                <div class="anno-function">หน้าที่: พื้นที่เกิดปฏิกิริยาเคมีและที่อยู่ของออร์แกเนลล์</div>
                <div class="anno-desc">ของเหลวคล้ายเจลที่กระจายอยู่ทั่วเซลล์ เป็นที่อยู่ของออร์แกเนลล์ต่างๆ</div>
            </div>
        </button>

        <button slot="hotspot-mitochondria" class="hotspot-btn" data-position="0.6 0.4 -0.2" data-normal="1 0 0">
            <div class="hotspot-number">4</div>
            <div class="annotation-box">
                <div class="anno-name">ไมโทคอนเดรีย (Mitochondria)</div>
                <div class="anno-function">หน้าที่: สร้างพลังงานให้แก่เซลล์ (ATP)</div>
                <div class="anno-desc">แหล่งผลิตพลังงานของเซลล์ เปรียบเสมือนโรงไฟฟ้าประจำเซลล์</div>
            </div>
        </button>

        <button slot="hotspot-golgi" class="hotspot-btn" data-position="-0.5 0.5 -0.3" data-normal="0 1 0">
            <div class="hotspot-number">5</div>
            <div class="annotation-box">
                <div class="anno-name">กอลจิบอดี (Golgi Apparatus)</div>
                <div class="anno-function">หน้าที่: ตกแต่ง บรรจุ และขนส่งโปรตีน</div>
                <div class="anno-desc">ทำหน้าที่รับโปรตีนมาปรับแต่ง ห่อหุ้มใส่ถุงบรรจุ (Vesicle) เพื่อส่งออกภายนอกเซลล์</div>
            </div>
        </button>

        <button slot="hotspot-er" class="hotspot-btn" data-position="0.2 0.3 0.3" data-normal="1 0 0">
            <div class="hotspot-number">6</div>
            <div class="annotation-box">
                <div class="anno-name">ร่างแหเอนโดพลาซึม (Endoplasmic Reticulum)</div>
                <div class="anno-function">หน้าที่: สังเคราะห์โปรตีนและไขมัน</div>
                <div class="anno-desc">แบ่งเป็นชนิดขรุขระ (สังเคราะห์โปรตีน) และชนิดเรียบ (สังเคราะห์ไขมันและกำจัดสารพิษ)</div>
            </div>
        </button>

        <button slot="hotspot-ribosome" class="hotspot-btn" data-position="-0.3 -0.4 0.6" data-normal="0 -1 0">
            <div class="hotspot-number">7</div>
            <div class="annotation-box">
                <div class="anno-name">ไรโบโซม (Ribosome)</div>
                <div class="anno-function">หน้าที่: สังเคราะห์โปรตีน</div>
                <div class="anno-desc">อนุภาคขนาดเล็ก ทำหน้าที่สร้างโปรตีนตามคำสั่งจากรหัสพันธุกรรม</div>
            </div>
        </button>

        <button slot="hotspot-lysosome" class="hotspot-btn" data-position="0.4 -0.5 -0.3" data-normal="1 0 0">
            <div class="hotspot-number">8</div>
            <div class="annotation-box">
                <div class="anno-name">ไลโซโซม (Lysosome)</div>
                <div class="anno-function">หน้าที่: ย่อยสลายสารและออร์แกเนลล์ที่เสื่อมสภาพ</div>
                <div class="anno-desc">ถุงบรรจุเอนไซม์สำหรับย่อยขยะ สิ่งแปลกปลอม หรือเชื้อโรคในเซลล์ (พบในเซลล์สัตว์)</div>
            </div>
        </button>

        <button slot="hotspot-centriole" class="hotspot-btn" data-position="-0.6 -0.2 -0.5" data-normal="-1 0 0">
            <div class="hotspot-number">9</div>
            <div class="annotation-box">
                <div class="anno-name">เซนทริโอล (Centriole)</div>
                <div class="anno-function">หน้าที่: ช่วยในการแบ่งเซลล์</div>
                <div class="anno-desc">สร้างเส้นใยสปินเดิลดึงโครโมโซมแยกออกจากกันระหว่างการแบ่งเซลล์สัตว์</div>
            </div>
        </button>

        <button slot="hotspot-vacuole" class="hotspot-btn" data-position="0.1 -0.6 0.2" data-normal="0 0 1">
            <div class="hotspot-number">10</div>
            <div class="annotation-box">
                <div class="anno-name">แวคิวโอล (Vacuole)</div>
                <div class="anno-function">หน้าที่: กักเก็บสารต่าง ๆ</div>
                <div class="anno-desc">ในเซลล์สัตว์จะมีขนาดเล็กและมีหลายอัน ทำหน้าที่เก็บสารอาหาร ของเหลว หรือของเสีย</div>
            </div>
        </button>

        <button slot="ar-button" id="ar-button">
            👁️ ส่องเซลล์ทะลุจอ (AR Mode)
        </button>
        
    </model-viewer>

</body>
</html>
